
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b14">
<title>Adii AI - Your AI Assistant</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b14;color:#eef2ff;font-family:Arial,sans-serif;min-height:100vh}
header{display:flex;align-items:center;gap:12px;padding:18px;background:#101625;border-bottom:1px solid #283047;position:sticky;top:0}
.logo{background:linear-gradient(135deg,#8b5cf6,#22d3ee);color:#080b14;font-weight:bold;font-size:25px;border-radius:14px;padding:10px 15px}
h1{font-size:20px;margin:0}
header p{margin:4px 0 0;color:#98a4bd;font-size:12px}
main{max-width:850px;margin:auto;padding:22px 14px 150px}
.welcome{text-align:center;padding:45px 0 25px}
.welcome h2{font-size:32px;margin-bottom:10px}
.welcome p{color:#98a4bd;line-height:1.6}
.suggestions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:24px auto;max-width:600px}
button{cursor:pointer;font:inherit}
.suggestion{padding:15px;background:#101625;color:#eef2ff;border:1px solid #283047;border-radius:13px;text-align:left}
.suggestion:hover{border-color:#8b5cf6}
.message{display:flex;margin:18px 0;gap:10px;align-items:flex-start}
.message.user{flex-direction:row-reverse}
.avatar{background:#27204a;border-radius:10px;padding:10px;font-weight:bold}
.message.ai .avatar{background:linear-gradient(135deg,#8b5cf6,#22d3ee);color:#080b14}
.bubble{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;padding:13px 15px;background:#101625;border:1px solid #283047;border-radius:4px 15px 15px 15px;max-width:85%}
.user .bubble{background:#27204a;border-radius:15px 4px 15px 15px}
.composer-wrap{position:fixed;bottom:0;left:0;right:0;padding:12px;background:#080b14}
form{display:flex;gap:8px;max-width:820px;margin:auto;background:#101625;border:1px solid #343d55;border-radius:16px;padding:8px}
textarea{flex:1;min-width:0;resize:none;max-height:130px;background:transparent;border:0;outline:none;color:white;padding:12px;font-size:16px}
textarea::placeholder{color:#98a4bd}
#send{border:0;border-radius:12px;background:linear-gradient(135deg,#8b5cf6,#22d3ee);padding:0 17px;font-size:20px;font-weight:bold}
#send:disabled{opacity:.5}
.note{text-align:center;font-size:11px;color:#98a4bd;margin:8px}
@media(max-width:500px){.suggestions{grid-template-columns:1fr}.welcome h2{font-size:26px}main{padding:15px 10px 140px}}
</style>
</head>
<body>
<header>
<div class="logo">A</div>
<div><h1>Adii AI</h1><p>Your AI assistant · Hindi & English</p></div>
</header>
<main id="chat">
<section class="welcome" id="welcome">
<h2>Hey, kya poochna hai? ✨</h2>
<p>Main tumhare sawaalon ke jawab dene, coding, padhai aur writing mein madad kar sakta hoon.</p>
<div class="suggestions">
<button class="suggestion">📚 Ek topic Hindi mein samjhao</button>
<button class="suggestion">💡 Creative idea do</button>
<button class="suggestion">💻 Website ka code likho</button>
<button class="suggestion">✍️ Ek story likho</button>
</div>
</section>
</main>
<div class="composer-wrap">
<form id="form">
<textarea id="input" rows="1" placeholder="Apna sawaal yahan likho..." maxlength="6000"></textarea>
<button id="send" type="submit">➤</button>
</form>
<div class="note">Adii AI · Tumhara personal AI assistant</div>
</div>
<script>
const chat=document.getElementById('chat');
const input=document.getElementById('input');
const form=document.getElementById('form');
const send=document.getElementById('send');
let history=[];
let busy=false;

function addMessage(role,text){
const welcome=document.getElementById('welcome');
if(welcome)welcome.remove();
const row=document.createElement('div');
row.className='message '+(role==='user'?'user':'ai');
const avatar=document.createElement('div');
avatar.className='avatar';
avatar.textContent=role==='user'?'You':'A';
const bubble=document.createElement('div');
bubble.className='bubble';
bubble.textContent=text;
row.append(avatar,bubble);
chat.appendChild(row);
window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
return bubble;
}

async function ask(text){
text=text.trim();
if(!text||busy)return;
addMessage('user',text);
const previous=history.slice();
history.push({role:'user',content:text});
input.value='';
input.style.height='auto';
busy=true;
send.disabled=true;
const waiting=addMessage('assistant','Soch raha hoon...');
try{
const response=await fetch('/api/chat',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({message:text,history:previous})
});
const data=await response.json();
waiting.parentElement.remove();
if(!response.ok)throw new Error(data.error||'AI se connection nahi ho paya.');
addMessage('assistant',data.answer);
history.push({role:'assistant',content:data.answer});
}catch(error){
waiting.textContent=error.message==='Failed to fetch'
?'AI server connect nahi hai. Backend hosting setup karna baaki hai.'
:error.message;
}finally{
busy=false;
send.disabled=false;
input.focus();
}
}

form.addEventListener('submit',e=>{
e.preventDefault();
ask(input.value);
});
input.addEventListener('input',()=>{
input.style.height='auto';
input.style.height=Math.min(input.scrollHeight,130)+'px';
});
input.addEventListener('keydown',e=>{
if(e.key==='Enter'&&!e.shiftKey){
e.preventDefault();
form.requestSubmit();
}
});
document.querySelectorAll('.suggestion').forEach(button=>{
button.addEventListener('click',()=>{
ask(button.textContent.replace(/^[^ ]+ /,''));
});
});
</script>
</body>
</html>
